<!doctype html>
<html lang="ru" data-theme="dark" data-font="system" data-icons="soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0D1018">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Трекер подписок: сколько уходит в месяц и когда следующее списание">
  <title>Subly — подписки</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./onboarding.css">
</head>
<body>
  <div class="app" id="app">
    <section class="pane active" id="paneHome" data-pane="home" aria-labelledby="homeTitle">
      <header class="head">
        <div>
          <h1 id="homeTitle">Подписки</h1>
          <p class="head-sub" id="todayLabel"></p>
        </div>
      </header>
      <div class="hero" id="hero">
        <div class="hero-top">
          <p class="hero-label">В месяц уходит</p>
          <span class="hero-count" id="heroCount"></span>
        </div>
        <p class="hero-amount"><span id="heroValue">0</span><span class="hero-cur" id="heroCur">₽</span></p>
        <p class="hero-note" id="heroNote"></p>
        <button class="next" id="nextCard" type="button" hidden>
          <i class="next-dot" id="nextDot"></i>
          <span class="next-name" id="nextName"></span>
          <span class="next-when" id="nextWhen"></span>
        </button>
      </div>
      <div class="chips" id="filters" role="group" aria-label="Фильтр списка">
        <button class="chip active" data-filter="all" aria-pressed="true">Все <i id="cntAll">0</i></button>
        <button class="chip" data-filter="soon" aria-pressed="false">Скоро <i id="cntSoon">0</i></button>
        <button class="chip" data-filter="expired" aria-pressed="false">Просрочено <i id="cntExpired">0</i></button>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
      <div class="empty" id="empty" hidden></div>
    </section>

    <section class="pane" id="paneStats" data-pane="stats" aria-labelledby="statsTitle" hidden>
      <header class="head">
        <div>
          <h1 id="statsTitle">Обзор</h1>
          <p class="head-sub">Куда уходят деньги</p>
        </div>
      </header>
      <div class="chips" id="statCurrency" hidden></div>
      <div id="statsBody"></div>
    </section>

    <section class="pane" id="paneSettings" data-pane="settings" aria-labelledby="settingsTitle" hidden>
      <header class="head">
        <div>
          <h1 id="settingsTitle">Настройки</h1>
          <p class="head-sub">Всё хранится на этом устройстве</p>
        </div>
      </header>

      <h2 class="group-title">Тема</h2>
      <div class="theme-grid" id="themeGrid"></div>

      <h2 class="group-title">Шрифт</h2>
      <div class="seg" id="fontSeg" data-n="3" style="--n:3"><i class="seg-thumb"></i></div>

      <h2 class="group-title">Иконки сервисов</h2>
      <div class="seg" id="iconSeg" data-n="2" style="--n:2"><i class="seg-thumb"></i></div>

      <h2 class="group-title">Валюта по умолчанию</h2>
      <div class="chips" id="currencyDefault"></div>

      <h2 class="group-title">Напоминания</h2>
      <div class="group">
        <label class="set-row" for="notifyToggle">
          <span class="set-text">
            <b>О скором списании</b>
            <small id="notifyHint">Напоминания о предстоящих списаниях</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="notifyToggle">
            <span class="switch-track"></span>
          </span>
        </label>
      </div>

      <h2 class="group-title">Данные</h2>
      <div class="group">
        <button class="set-row set-btn" id="exportBtn" type="button">
          <span class="set-text">
            <b>Сохранить копию</b>
            <small>Файл JSON со всеми подписками</small>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="set-row set-btn" id="importBtn" type="button">
          <span class="set-text">
            <b>Загрузить из копии</b>
            <small>Заменит текущий список</small>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="set-row set-btn danger" id="resetBtn" type="button">
          <span class="set-text">
            <b>Удалить все подписки</b>
            <small>Это действие нельзя отменить</small>
          </span>
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>

      <p class="foot-note">Subly — личный учёт подписок</p>
    </section>
  </div>

  <div class="dock">
    <nav class="tabs" id="tabs" style="--i:0" aria-label="Разделы">
      <i class="tabs-thumb"></i>
      <button class="tab active" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4.5" width="16" height="5" rx="1.8"/>
          <rect x="4" y="11.5" width="16" height="5" rx="1.8"/>
          <path d="M7 20h10"/>
        </svg>
        <span>Подписки</span>
      </button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 19v-7M12 19V5M18 19v-4"/>
        </svg>
        <span>Обзор</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 8h9M18.5 8h1M4.5 16h1M10 16h9.5"/>
          <circle cx="16" cy="8" r="2.2"/>
          <circle cx="7.5" cy="16" r="2.2"/>
        </svg>
        <span>Настройки</span>
      </button>
    </nav>
    <button class="fab" id="fab" type="button" aria-label="Добавить подписку">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="sheet-layer" id="sheetLayer">
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-top" id="sheetTop">
        <i class="grabber"></i>
        <div class="sheet-head">
          <h2 id="sheetTitle">Новая подписка</h2>
          <button class="icon-btn" id="sheetClose" type="button" aria-label="Закрыть">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <form class="step" id="stepForm" novalidate>
        <div class="name-row">
          <button class="tile-btn" id="lookToggle" type="button" aria-label="Изменить иконку" aria-expanded="false">
            <span id="formTile"></span>
            <i class="tile-edit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4 9.5-9.5 3 3L9 18z"/></svg>
            </i>
          </button>
          <label class="field grow">
            <span class="field-label">Название</span>
            <input id="fName" type="text" maxlength="60" placeholder="Например, Spotify" autocomplete="off" required>
          </label>
        </div>

        <div class="sugg" id="sugg" role="group" aria-label="Подсказки сервисов"></div>

        <div class="look" id="look">
          <div class="look-in">
            <p class="field-label">Иконка</p>
            <div class="glyph-grid" id="glyphGrid"></div>
            <p class="field-label">Цвет</p>
            <div class="color-row" id="colorRow"></div>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Сколько платите</span>
          <input id="fPrice" class="price-input" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Цена" required>
          <div class="chips tight" id="fCurrency" role="group" aria-label="Валюта"></div>
        </div>

        <div class="field">
          <span class="field-label">Как часто</span>
          <div class="seg" id="fPeriod" data-n="4" style="--n:4"><i class="seg-thumb"></i></div>
        </div>

        <div class="field">
          <span class="field-label">Следующее списание</span>
          <div class="chips tight" id="fDateChips" role="group" aria-label="Быстрый выбор даты"></div>
          <input id="fDate" type="date" required aria-label="Дата списания">
          <p class="date-note" id="fDateNote"></p>
        </div>

        <div class="form-actions">
          <button class="btn primary" id="fSave" type="submit">Добавить</button>
          <div class="btn-pair" id="editExtras" hidden>
            <button class="btn soft" id="fPaid" type="button">Оплачено</button>
            <button class="btn soft danger" id="fDelete" type="button">Удалить</button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <div class="dialog-layer" id="dialog" hidden>
    <div class="scrim"></div>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgText">
      <h3 id="dlgTitle"></h3>
      <p id="dlgText"></p>
      <div class="btn-pair">
        <button class="btn soft" id="dlgCancel" type="button">Отмена</button>
        <button class="btn primary" id="dlgOk" type="button">Да</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

  <!-- Подключаем модули приложения -->
  <script type="module" src="./icons.js"></script>
  <script type="module" src="./native-notifications.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./onboarding.js"></script>
</body>
            </html>
